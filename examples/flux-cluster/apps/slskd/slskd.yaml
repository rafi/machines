# Flux Kustomization: builds apps/<app> from the `machines` repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: slskd
  namespace: flux-system
spec:
  interval: 10m
  # Optional: wait for another app first.
  # dependsOn:
  #   - name: postgres
  sourceRef:
    kind: GitRepository
    name: machines
    namespace: flux-system
  path: apps/slskd
  prune: true
  wait: true
  # Values for the ${VAR} placeholders in the app manifests.
  # Flux envsubst runs after the kustomize build. Plain values only:
  # `substituteFrom` reads Secrets/ConfigMaps from this Kustomization's own
  # namespace (flux-system), not from the app namespace.
  postBuild:
    substitute:
      SLSKD_HOST_NAME: app.example.com
      SLSKD_SLSK_LISTEN_PORT: "50300"
