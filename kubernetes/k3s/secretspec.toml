#:schema https://secretspec.dev/schema/secretspec.schema.json
# Values come from pass (secretspec/machines/default/<KEY>).

[project]
name = "machines"
revision = "1.0"

[profiles.default]
K3S_TOKEN = { description = "k3s cluster token", required = true }
CLUSTER_NODE_IP = { description = "The node's LAN address; k3s binds to it", required = true }
CLUSTER_NODE_NAME = { description = "Hostname of the cluster node", required = true }
SECRET_DOMAIN = { description = "Base domain (node label)", required = true }
