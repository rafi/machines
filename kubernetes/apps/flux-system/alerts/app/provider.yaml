---
# Secret telegram-bot (the bot token): `just kube secrets alerts`.
# The chat ID comes from cluster-settings, already quoted (a bare number would
# not be a string after substitution).
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: telegram
spec:
  type: telegram
  channel: ${FLUX_TELEGRAM_CHAT_ID}
  secretRef:
    name: telegram-bot
