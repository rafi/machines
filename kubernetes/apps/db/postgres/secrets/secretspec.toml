#:schema https://secretspec.dev/schema/secretspec.schema.json
# Values come from pass (secretspec/machines/default/<KEY>).

[project]
name = "machines"
revision = "1.0"

[profiles.default]
POSTGRES_MINIFLUX_USERNAME = { description = "Owner role of the miniflux database", required = true }
POSTGRES_MINIFLUX_PASSWORD = { description = "Password of that role", required = true }
POSTGRES_AUTHELIA_PASSWORD = { description = "Password of the authelia role (owner of the authelia database)", required = true }
