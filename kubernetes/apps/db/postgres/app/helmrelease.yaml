---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# CloudNativePG `cluster` chart. Service: postgres-rw.db.svc.cluster.local
# https://github.com/cloudnative-pg/charts/tree/main/charts/cluster
#
# To add a database for an app: a basic-auth Secret `pg-<app>` in
# ../secrets/, plus a role and a database below. `initdb` only runs at the
# first bootstrap and creates the first database.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
spec:
  chartRef:
    kind: OCIRepository
    name: postgres
  interval: 1h
  values:
    fullnameOverride: postgres

    # The image is ghcr.io/cloudnative-pg/postgresql:<this>. Pinned so a chart
    # update can't move it; Renovate raises it within 16.x (.renovaterc.json5).
    # A new major needs a planned upgrade (and the backup's pg_dump with it).
    version:
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
      postgresql: "16.15"

    cluster:
      instances: 1
      # A PDB on a single instance would block node drains.
      enablePDB: false
      # Superuser has no password (peer auth in-pod only); apps use owner roles.
      enableSuperuserAccess: false
      storage:
        size: 8Gi
      monitoring:
        enabled: false
        podMonitor:
          enabled: false
        prometheusRule:
          enabled: false
      initdb:
        database: miniflux
        owner: usrminiflux
        secret:
          name: pg-miniflux
      roles:
        - name: usrminiflux
          ensure: present
          login: true
          passwordSecret:
            name: pg-miniflux
        - name: authelia
          ensure: present
          login: true
          passwordSecret:
            name: pg-authelia
    databases:
      - name: miniflux
        owner: usrminiflux
      - name: authelia
        owner: authelia
  # The chart doesn't expose smartShutdownTimeout. A smart shutdown waits for
  # clients to disconnect, but miniflux's and Authelia's pools never do, so
  # every restart (each image bump) sat out the default 180s. 15s still lets
  # a running statement, e.g. the nightly pg_dump, finish before the fast
  # shutdown cuts the remaining connections; the apps reconnect.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Cluster
              name: postgres
            patch: |
              - op: add
                path: /spec/smartShutdownTimeout
                value: 15
