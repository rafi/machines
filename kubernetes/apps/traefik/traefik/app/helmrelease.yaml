---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Gateway API only: the Ingress provider and IngressClass are disabled.
# https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  chartRef:
    kind: OCIRepository
    name: traefik
  interval: 1h
  values:
    fullnameOverride: traefik

    deployment:
      kind: Deployment
      replicas: 1

    # In-cluster ClusterIP only, as this is a proxy target for rathole.
    # k3s servicelb/ports are not touched.
    service:
      type: ClusterIP

    ingressClass:
      enabled: false

    providers:
      kubernetesIngress:
        enabled: false
      # Needed for Traefik Middleware CRs referenced from HTTPRoute ExtensionRef filters.
      kubernetesCRD:
        enabled: true
        safeNaming: true
      kubernetesGateway:
        enabled: true

    ports:
      web:
        port: 8000
        exposedPort: 80
        # As this ingress is a proxy to rathole, trust forwarded headers.
        forwardedHeaders:
          insecure: true
        http:
          # Drop X_Auth_User / X.Auth.User style aliases so clients can't spoof the
          # Authelia Remote-* headers for backends that normalize header names.
          aliasHeadersStrategy: delete
      websecure:
        port: 8443
        exposedPort: 443
        # Reached through the server's nginx stream block and rathole's
        # ingress-tls service: the client's address arrives in a PROXY header
        # from the rathole client, a pod (k3s' pod network). Forwarded headers
        # are not trusted here: the client talks to Traefik directly.
        proxyProtocol:
          trustedIPs:
            - 10.42.0.0/16
        http:
          aliasHeadersStrategy: delete
      # Internal entrypoints (not exposed); set only to silence the warning.
      traefik:
        http:
          aliasHeadersStrategy: delete
      metrics:
        http:
          aliasHeadersStrategy: delete

    # Dashboard and API are off; enable and expose via an IngressRoute if needed.
    ingressRoute:
      dashboard:
        enabled: false

    api:
      dashboard: false

    # Default Gateway "traefik-gateway" (namespace traefik) with an HTTP listener
    # "web" on entrypoint port 8000. HTTPRoutes in all namespaces may attach to it:
    #   parentRefs: [{name: traefik-gateway, namespace: traefik, sectionName: web}]
    # "websecure" (8443) terminates TLS with the wildcard certificate from
    # ../../certificate. Nothing public reaches it yet: rathole forwards to
    # port 80 only, and the server's nginx still terminates TLS.
    gateway:
      enabled: true
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
        websecure:
          port: 8443
          protocol: HTTPS
          mode: Terminate
          certificateRefs:
            - kind: Secret
              name: wildcard-tls
          namespacePolicy:
            from: All

    log:
      level: INFO

    accessLog:
      enabled: true

    metrics:
      prometheus: null
