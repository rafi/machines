---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Gateway API only: the Ingress provider and IngressClass are disabled.
# Every request on websecure passes CrowdSec's bouncer plugin first
# (crowdsec@file), which answers 403 to IPs CrowdSec bans
# (kubernetes/apps/crowdsec). Secret crowdsec-bouncer: `just kube secrets traefik`.
# https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  chartRef:
    kind: OCIRepository
    name: traefik
  interval: 1h
  values:
    fullnameOverride: traefik

    deployment:
      kind: Deployment
      replicas: 1
      # The plugin reads its LAPI key at start.
      annotations:
        secret.reloader.stakater.com/reload: crowdsec-bouncer
      # The bouncer plugin's source, fetched at its pinned tag from GitHub
      # at every start (Traefik's plugin catalog is not involved).
      initContainers:
        - name: fetch-crowdsec-bouncer
          image: mirror.gcr.io/library/alpine:3.22
          env:
            # renovate: datasource=github-releases depName=maxlerebourg/crowdsec-bouncer-traefik-plugin
            - { name: PLUGIN_VERSION, value: v1.8.1 }
          command:
            - sh
            - -c
            - >-
              wget -qO- "https://github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin/archive/refs/tags/$PLUGIN_VERSION.tar.gz"
              | tar -xz -C /plugin --strip-components=1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 64Mi
          volumeMounts:
            - name: crowdsec-bouncer-plugin
              mountPath: /plugin
      additionalVolumes:
        - name: crowdsec-bouncer-plugin
          emptyDir: {}
        - name: crowdsec-bouncer-key
          secret:
            secretName: crowdsec-bouncer

    additionalVolumeMounts:
      - name: crowdsec-bouncer-key
        mountPath: /etc/crowdsec-bouncer
        readOnly: true

    experimental:
      localPlugins:
        crowdsec-bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          mountPath: /plugins-local/src/github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          type: localPath
          volumeName: crowdsec-bouncer-plugin

    # In-cluster ClusterIP only: rathole's client is the one way in. The
    # chart reads the type from service.spec (default LoadBalancer).
    service:
      spec:
        type: ClusterIP

    ingressClass:
      enabled: false

    providers:
      kubernetesIngress:
        enabled: false
      # Needed for Traefik Middleware CRs referenced from HTTPRoute ExtensionRef filters.
      kubernetesCRD:
        enabled: true
        safeNaming: true
      kubernetesGateway:
        enabled: true
      # Middleware crowdsec@file, prepended to every websecure route.
      # Stream mode: the ban list is pulled from LAPI every minute and kept in
      # memory. If LAPI is down the last list still applies and nothing else
      # is blocked, also when Traefik starts without it (updateMaxFailure -1,
      # streamStartupBlock false).
      file:
        enabled: true
        content:
          http:
            middlewares:
              crowdsec:
                plugin:
                  crowdsec-bouncer:
                    enabled: true
                    crowdsecMode: stream
                    updateMaxFailure: -1
                    streamStartupBlock: false
                    crowdsecLapiScheme: http
                    crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
                    crowdsecLapiKeyFile: /etc/crowdsec-bouncer/key

    ports:
      # Nothing reaches port 80 any more (the server redirects plain HTTP
      # itself): not on the Service, no Gateway listener.
      web:
        port: 8000
        expose:
          default: false
        http:
          # Drop X_Auth_User / X.Auth.User style aliases so clients can't spoof the
          # Authelia Remote-* headers for backends that normalize header names.
          aliasHeadersStrategy: delete
      websecure:
        port: 8443
        exposedPort: 443
        # Reached through the server's nginx stream block and rathole's
        # ingress-tls service: the client's address arrives in a PROXY header
        # from the rathole client, a pod (k3s' pod network). Forwarded headers
        # are not trusted here: the client talks to Traefik directly.
        proxyProtocol:
          trustedIPs:
            - 10.42.0.0/16
        http:
          aliasHeadersStrategy: delete
          middlewares:
            - crowdsec@file
      # Internal entrypoints (not exposed); set only to silence the warning.
      traefik:
        http:
          aliasHeadersStrategy: delete
      metrics:
        http:
          aliasHeadersStrategy: delete

    # Dashboard and API are off; enable and expose via an IngressRoute if needed.
    ingressRoute:
      dashboard:
        enabled: false

    api:
      dashboard: false

    # Default Gateway "traefik-gateway" (namespace traefik) with one listener,
    # "websecure" (8443), which terminates TLS for every host with the
    # wildcard certificate from ../../certificate. HTTPRoutes in all
    # namespaces may attach to it:
    #   parentRefs: [{name: traefik-gateway, namespace: traefik, sectionName: websecure}]
    gateway:
      enabled: true
      listeners:
        # The chart's default listener; null removes it.
        web: null
        websecure:
          port: 8443
          protocol: HTTPS
          mode: Terminate
          certificateRefs:
            - kind: Secret
              name: wildcard-tls
          namespacePolicy:
            from: All

    log:
      level: INFO

    accessLog:
      enabled: true

    metrics:
      prometheus: null
