---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
# <domain> and *.<domain> in Secret wildcard-tls. A wildcard keeps the
# hostnames out of the public Certificate Transparency logs. cert-manager
# renews it 30 days before it expires; Traefik picks up the new Secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
spec:
  dnsNames:
    - ${SECRET_DOMAIN}
    - "*.${SECRET_DOMAIN}"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: wildcard-tls
