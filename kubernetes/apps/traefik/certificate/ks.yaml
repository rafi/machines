---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The domain's wildcard certificate, in Traefik's namespace so the Gateway's
# websecure listener can reference its Secret. Ready once issued; the first
# issue takes a few minutes (DNS-01), and a failure shows on the
# Certificate's events (`kubectl -n traefik describe certificate wildcard`).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificate
spec:
  dependsOn:
    - name: cert-manager-issuers
      namespace: cert-manager
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: wildcard
      namespace: traefik
  timeout: 10m
  interval: 1h
  path: ./kubernetes/apps/traefik/certificate/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: traefik
