#:schema https://secretspec.dev/schema/secretspec.schema.json
# Values come from pass (secretspec/machines/default/<KEY>).

[project]
name = "machines"
revision = "1.0"

[profiles.default]
SECRET_DOMAIN = { description = "Base domain", required = true }
SERVER_HOSTNAME = { description = "The server's hostname, where rathole and the SOCKS5 proxy listen", required = true }
RATHOLE_DEFAULT_TOKEN = { description = "Shared token, equal on the server", required = true }
RATHOLE_ROOT_CA_CRT = { description = "CA certificate that signed the server certificate", required = true }
CLUSTER_NODE_NAME = { description = "Hostname of the cluster node", required = true }
CLUSTER_SSH_PORT = { description = "sshd port on the cluster node, tunnelled from the server", required = true }
RATHOLE_SERVER_SERVICES_SLSKD_PORT = { description = "Soulseek port: the slskd Service port, equal on the server", required = true }
