---
# https://github.com/rapiz1/rathole#configuration
apiVersion: v1
kind: Secret
metadata:
  name: rathole-conf
stringData:
  client.toml: |
    [client]
    remote_addr = "${SERVER_HOSTNAME}:23491"
    default_token = "${RATHOLE_DEFAULT_TOKEN}"
    retry_interval = 3

    [client.transport]
    type = "tls"
    [client.transport.tls]
    trusted_root = "/etc/rathole/certs/rootCA.crt"
    # The hostname that the client uses to validate the certificate.
    hostname = "localhost"

    # Services must match [server.services.*] on the server.
    [client.services.ingress]
    local_addr = "traefik.traefik:80"

    [client.services.ssh]
    local_addr = "${CLUSTER_SSH_HOST}:${CLUSTER_SSH_PORT}"

    [client.services.slskd]
    local_addr = "slskd.default:30002"
