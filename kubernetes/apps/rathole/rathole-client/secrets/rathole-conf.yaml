---
# https://github.com/rapiz1/rathole#configuration
apiVersion: v1
kind: Secret
metadata:
  name: rathole-conf
stringData:
  client.toml: |
    [client]
    remote_addr = "${SERVER_HOSTNAME}:23491"
    default_token = "${RATHOLE_DEFAULT_TOKEN}"
    retry_interval = 3

    [client.transport]
    type = "tls"
    [client.transport.tls]
    trusted_root = "/etc/rathole/certs/rootCA.crt"
    # The hostname that the client uses to validate the certificate.
    hostname = "localhost"

    # Services must match [server.services.*] on the server.
    [client.services.ingress]
    local_addr = "traefik.traefik:80"

    # TLS passed through by the server's nginx, with a PROXY header.
    [client.services.ingress-tls]
    local_addr = "traefik.traefik:443"

    [client.services.ssh]
    local_addr = "${CLUSTER_NODE_NAME}:${CLUSTER_SSH_PORT}"

    [client.services.slskd]
    local_addr = "slskd.default:${RATHOLE_SERVER_SERVICES_SLSKD_PORT}"

    # nginx on the server reaches Authelia through this (127.0.0.1:9091 there).
    [client.services.authelia]
    local_addr = "authelia.auth:9091"
