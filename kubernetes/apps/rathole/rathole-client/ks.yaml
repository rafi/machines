---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rathole-client
spec:
  interval: 1h
  path: ./kubernetes/apps/rathole/rathole-client/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: rathole
  wait: true
