---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
spec:
  interval: 1h
  path: ./config/crd
  # Never garbage-collect CRDs: deleting them deletes every Gateway/HTTPRoute.
  prune: false
  sourceRef:
    kind: GitRepository
    name: gateway-api
  wait: true
