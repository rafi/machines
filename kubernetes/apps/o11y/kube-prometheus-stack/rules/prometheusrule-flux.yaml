---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
# gotk_resource_info comes from kube-state-metrics (app/resources/
# flux-metrics.yaml). max by: one series per object, whichever
# kube-state-metrics pod exported it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux
spec:
  groups:
    - name: flux
      rules:
        - alert: FluxResourceNotReady
          expr: max by (customresource_kind, exported_namespace, name) (gotk_resource_info{ready="False"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.customresource_kind }}
              {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready
