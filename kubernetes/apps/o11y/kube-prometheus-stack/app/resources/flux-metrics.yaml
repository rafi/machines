---
# Merged into the HelmRelease's values (valuesFrom). kube-state-metrics
# exports gotk_resource_info for Flux's Kustomizations, HelmReleases,
# GitRepositories and OCIRepositories, with their Ready condition.
# https://fluxcd.io/flux/monitoring/custom-metrics/
kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
        resources:
          - gitrepositories
          - ocirepositories
          - kustomizations
          - helmreleases
        verbs:
          - list
          - watch
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux Kustomization resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                        - metadata
                        - name
                labelsFromPath:
                  exported_namespace:
                    - metadata
                    - namespace
                  ready:
                    - status
                    - conditions
                    - "[type=Ready]"
                    - status
                  suspended:
                    - spec
                    - suspend
                  revision:
                    - status
                    - lastAppliedRevision
                  source_name:
                    - spec
                    - sourceRef
                    - name
          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux HelmRelease resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                        - metadata
                        - name
                labelsFromPath:
                  exported_namespace:
                    - metadata
                    - namespace
                  ready:
                    - status
                    - conditions
                    - "[type=Ready]"
                    - status
                  suspended:
                    - spec
                    - suspend
                  revision:
                    - status
                    - history
                    - "0"
                    - chartVersion
                  chart_name:
                    - status
                    - history
                    - "0"
                    - chartName
                  chart_app_version:
                    - status
                    - history
                    - "0"
                    - appVersion
                  chart_ref_name:
                    - spec
                    - chartRef
                    - name
                  chart_source_name:
                    - spec
                    - chart
                    - spec
                    - sourceRef
                    - name
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: GitRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux GitRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                        - metadata
                        - name
                labelsFromPath:
                  exported_namespace:
                    - metadata
                    - namespace
                  ready:
                    - status
                    - conditions
                    - "[type=Ready]"
                    - status
                  suspended:
                    - spec
                    - suspend
                  revision:
                    - status
                    - artifact
                    - revision
                  url:
                    - spec
                    - url
          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: OCIRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux OCIRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                        - metadata
                        - name
                labelsFromPath:
                  exported_namespace:
                    - metadata
                    - namespace
                  ready:
                    - status
                    - conditions
                    - "[type=Ready]"
                    - status
                  suspended:
                    - spec
                    - suspend
                  revision:
                    - status
                    - artifact
                    - revision
                  url:
                    - spec
                    - url
