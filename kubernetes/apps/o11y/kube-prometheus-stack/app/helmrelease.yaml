---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Prometheus, Alertmanager, the operator, kube-state-metrics and
# node-exporter. k3s runs the API server, scheduler, controller-manager and
# proxy inside its own process without separate metrics endpoints, and has
# no etcd (SQLite): their monitors and rule groups are off, or they would
# alert as down forever.
# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    fullnameOverride: kube-prometheus-stack
    cleanPrometheusOperatorObjectNames: true

    defaultRules:
      rules:
        etcd: false
        kubeApiserverAvailability: false
        kubeApiserverBurnrate: false
        kubeApiserverHistogram: false
        kubeApiserverSlos: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        windows: false

    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    thanosRuler:
      enabled: false
    windowsMonitoring:
      enabled: false

    # Off until its route exists.
    grafana:
      enabled: false

    prometheusOperator:
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    prometheus:
      prometheusSpec:
        # Every ServiceMonitor, PodMonitor, Probe, PrometheusRule and
        # ScrapeConfig in every namespace, not only this release's.
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 8GiB
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi

    alertmanager:
      # Telegram's HTML parse mode rejects stray <, > and &, so alert text
      # goes through `html`.
      config:
        route:
          receiver: telegram
          group_by: [alertname, namespace]
          repeat_interval: 12h
          routes:
            - receiver: blackhole
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
        # The chart's defaults: Helm replaces lists, so all are restated.
        # InfoInhibitor fires to silence lone info alerts in its namespace.
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal: [alertname, namespace]
          - source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
            equal: [alertname, namespace]
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal: [namespace]
          - target_matchers:
              - alertname = InfoInhibitor
        receivers:
          - name: blackhole
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
                chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat_id
                parse_mode: HTML
                send_resolved: true
                message: |-
                  <b>{{ .Status | toUpper }}</b>: {{ .CommonLabels.alertname | html }}
                  {{- range .Alerts }}
                  • {{ with .Annotations.summary }}{{ . | html }}{{ else }}{{ .Annotations.description | html }}{{ end }}
                  {{- if .Labels.namespace }} [{{ .Labels.namespace | html }}{{ with .Labels.pod }}/{{ . | html }}{{ end }}]{{ end }}
                  {{- end }}
      alertmanagerSpec:
        # Mounted at /etc/alertmanager/secrets/alertmanager-telegram/.
        secrets: [alertmanager-telegram]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi
