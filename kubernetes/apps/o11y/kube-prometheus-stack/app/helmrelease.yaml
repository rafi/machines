---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Prometheus, Alertmanager, the operator, kube-state-metrics and
# node-exporter. k3s runs the API server, scheduler, controller-manager and
# proxy inside its own process without separate metrics endpoints, and has
# no etcd (SQLite): their monitors and rule groups are off, or they would
# alert as down forever.
# https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  # kube-state-metrics' Flux metrics (resources/flux-metrics.yaml).
  valuesFrom:
    - kind: ConfigMap
      name: flux-metrics-configmap
      valuesKey: flux-metrics.yaml
  values:
    fullnameOverride: kube-prometheus-stack
    cleanPrometheusOperatorObjectNames: true

    defaultRules:
      rules:
        etcd: false
        kubeApiserverAvailability: false
        kubeApiserverBurnrate: false
        kubeApiserverHistogram: false
        kubeApiserverSlos: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        windows: false

    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeDns:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    thanosRuler:
      enabled: false
    windowsMonitoring:
      enabled: false

    # Logs in whoever Authelia passes (Remote-User). auth.proxy can't map
    # Remote-Groups to roles, so every user is Admin and Authelia lets only
    # lldap_admin through (authelia's access_control). The chart's default
    # dashboards and its Prometheus and Alertmanager data sources stay on;
    # no persistence, dashboards come from ConfigMaps.
    grafana:
      enabled: true
      grafana.ini:
        server:
          root_url: https://grafana.${SECRET_DOMAIN}
        auth:
          disable_login_form: true
        auth.basic:
          enabled: false
        auth.proxy:
          enabled: true
          header_name: Remote-User
          header_property: username
          auto_sign_up: true
          headers: Email:Remote-Email Name:Remote-Name Groups:Remote-Groups
          # The pod CIDR: Traefik's pods.
          whitelist: 10.42.0.0/16
        users:
          auto_assign_org_role: Admin
      # With basic auth off, the sidecars' reload calls (admin user and
      # password on localhost) get 401. Data sources are written once by an
      # init container before Grafana starts (LIST, or it watches forever);
      # dashboards are picked up by the file provider's polling.
      sidecar:
        datasources:
          initDatasources: true
          watchMethod: LIST
          skipReload: true
        dashboards:
          skipReload: true
      route:
        main:
          enabled: true
          hostnames:
            - grafana.${SECRET_DOMAIN}
          parentRefs: &parentRefs
            - name: traefik-gateway
              namespace: traefik
              sectionName: websecure
          filters: &authelia
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: authelia

    prometheusOperator:
      admissionWebhooks:
        patch:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.${SECRET_DOMAIN}
          parentRefs: *parentRefs
          filters: *authelia
      prometheusSpec:
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        # Every ServiceMonitor, PodMonitor, Probe, PrometheusRule and
        # ScrapeConfig in every namespace, not only this release's.
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 8GiB
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi

    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.${SECRET_DOMAIN}
          parentRefs: *parentRefs
          filters: *authelia
      # Telegram's HTML parse mode rejects stray <, > and &, so alert text
      # goes through `html`. Flux's events (Provider alertmanager) carry their
      # text in a `message` annotation and the object in a `name` label.
      config:
        route:
          receiver: telegram
          group_by: [alertname, namespace]
          repeat_interval: 12h
          routes:
            - receiver: blackhole
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
        # The chart's defaults: Helm replaces lists, so all are restated.
        # InfoInhibitor fires to silence lone info alerts in its namespace.
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal: [alertname, namespace]
          - source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
            equal: [alertname, namespace]
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal: [namespace]
          - target_matchers:
              - alertname = InfoInhibitor
        receivers:
          - name: blackhole
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
                chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat_id
                parse_mode: HTML
                send_resolved: true
                message: |-
                  <b>{{ .Status | toUpper }}</b>: {{ .CommonLabels.alertname | html }}
                  {{- range .Alerts }}
                  • {{ with .Annotations.summary }}{{ . | html }}{{ else }}{{ with .Annotations.description }}{{ . | html }}{{ else }}{{ .Annotations.message | html }}{{ end }}{{ end }}
                  {{- if .Labels.namespace }} [{{ .Labels.namespace | html }}{{ with .Labels.pod }}/{{ . | html }}{{ else }}{{ with .Labels.name }}/{{ . | html }}{{ end }}{{ end }}]{{ end }}
                  {{- end }}
      alertmanagerSpec:
        externalUrl: https://alertmanager.${SECRET_DOMAIN}
        # Mounted at /etc/alertmanager/secrets/alertmanager-telegram/.
        secrets: [alertmanager-telegram]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi
