---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blackbox-exporter
spec:
  groups:
    - name: blackbox-exporter
      rules:
        - alert: ServerUnreachable
          expr: probe_success{job="probe/o11y/server-tcp"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The server doesn't accept connections on port 80
        - alert: PublicSiteDown
          expr: probe_success{job="probe/o11y/public-https"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: '{{ $labels.instance }} is down from home'
