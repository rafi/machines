---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# https://github.com/slskd/slskd
# Secret slskd-env: `just kube secrets slskd`.
# The Soulseek port is forwarded from the server by rathole, and outgoing
# connections use the SOCKS5 proxy on the server, so peers see the server's address.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slskd
spec:
  chartRef:
    kind: OCIRepository
    name: slskd
  interval: 1h
  values:
    controllers:
      slskd:
        annotations:
          reloader.stakater.com/auto: "true"
        # One instance only: state is on a hostPath and the Soulseek login is single-session.
        strategy: Recreate
        containers:
          app:
            image:
              repository: slskd/slskd
              tag: 0.26.1
            env:
              SLSKD_SHARED_DIR: /music;/ebooks
            envFrom:
              - secretRef:
                  name: slskd-env
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: 5030
          # The rathole service port on the server; slskd listens on it too.
          soulseek:
            port: ${RATHOLE_SERVER_SERVICES_SLSKD_PORT}
    route:
      app:
        hostnames:
          - home.${SECRET_DOMAIN}
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
            sectionName: websecure
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /slsk
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authelia
            backendRefs:
              - identifier: app
                port: 80
    configMaps:
      config:
        data:
          slskd.yml: |
            web:
              url_base: /slsk
            soulseek:
              listen_port: ${RATHOLE_SERVER_SERVICES_SLSKD_PORT}
              connection:
                proxy:
                  enabled: true
                  address: ${SERVER_HOSTNAME}
                  port: ${MICROSOCKS_PORT}
    persistence:
      data:
        type: hostPath
        hostPath: /opt/slskd
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /app
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /app/slskd.yml
            subPath: slskd.yml
      music:
        type: hostPath
        hostPath: /home/rafi/media/music
        hostPathType: Directory
        globalMounts:
          - path: /music
      ebooks:
        type: hostPath
        hostPath: /home/rafi/media/ebooks
        hostPathType: Directory
        globalMounts:
          - path: /ebooks
