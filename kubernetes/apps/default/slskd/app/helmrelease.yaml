---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# https://github.com/slskd/slskd
# Secrets slskd-env and sslocal-config: `just kube secrets slskd`.
# The Soulseek port is forwarded from the server by rathole. Outgoing
# connections go through the sslocal container's SOCKS5 port (localhost:1080),
# which carries them encrypted to shadowsocks on the server
# (server/shadowsocks), so peers see the server's address.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slskd
spec:
  chartRef:
    kind: OCIRepository
    name: slskd
  interval: 1h
  values:
    controllers:
      slskd:
        annotations:
          reloader.stakater.com/auto: "true"
        # One instance only: state is on a hostPath and the Soulseek login is single-session.
        strategy: Recreate
        # /opt/slskd is a hostPath, which fsGroup doesn't chown: it must be
        # owned by 1000:1000 on the node. The media folders only need to be
        # readable by it.
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
        containers:
          app:
            image:
              repository: ghcr.io/slskd/slskd
              tag: 0.26.1@sha256:588af49abc3088d639c8f1174d3bfad6e92c093a275a593140e3ac9311ebf6c4
            env:
              # The image extracts its .NET bundle to /.net, read-only here.
              DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
            envFrom:
              - secretRef:
                  name: slskd-env
            # /health needs no login and answers with or without url_base.
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    path: /health
                    port: 5030
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              # Up to 5 minutes to start (share scan, Soulseek login).
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          sslocal:
            image:
              repository: ghcr.io/shadowsocks/sslocal-rust
              tag: v1.25.0
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: 5030
          # The rathole service port on the server; slskd listens on it too.
          soulseek:
            port: ${RATHOLE_SERVER_SERVICES_SLSKD_PORT}
    route:
      app:
        hostnames:
          - home.${SECRET_DOMAIN}
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
            sectionName: websecure
        rules:
          - matches:
              - path:
                  value: /slsk
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authelia
            backendRefs:
              - identifier: app
                port: 80
    configMaps:
      config:
        data:
          slskd.yml: |
            flags:
              no_version_check: true
            web:
              url_base: /slsk
              # Unused: TLS ends at Traefik.
              https:
                disabled: true
              # Authelia guards the route; slskd's own login is off.
              authentication:
                disabled: true
            shares:
              directories:
                - /music
                - /ebooks
              filters:
                - \.ini$
                - Thumbs.db$
                - \.DS_Store$
            soulseek:
              listen_port: ${RATHOLE_SERVER_SERVICES_SLSKD_PORT}
              connection:
                proxy:
                  enabled: true
                  address: 127.0.0.1
                  port: 1080
    persistence:
      data:
        type: hostPath
        hostPath: /opt/slskd
        hostPathType: DirectoryOrCreate
        advancedMounts:
          slskd:
            app:
              - path: /app
      config-file:
        type: configMap
        identifier: config
        advancedMounts:
          slskd:
            app:
              - path: /app/slskd.yml
                subPath: slskd.yml
      music:
        type: hostPath
        hostPath: /home/rafi/media/music
        hostPathType: Directory
        advancedMounts:
          slskd:
            app:
              - path: /music
      ebooks:
        type: hostPath
        hostPath: /home/rafi/media/ebooks
        hostPathType: Directory
        advancedMounts:
          slskd:
            app:
              - path: /ebooks
      tmp:
        type: emptyDir
        advancedMounts:
          slskd:
            app:
              - path: /tmp
      sslocal-config:
        type: secret
        name: sslocal-config
        advancedMounts:
          slskd:
            sslocal:
              - path: /etc/shadowsocks-rust/config.json
                subPath: config.json
                readOnly: true
