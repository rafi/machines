#:schema https://secretspec.dev/schema/secretspec.schema.json
# Values come from pass (secretspec/machines/default/<KEY>).

[project]
name = "machines"
revision = "1.0"

[profiles.default]
SLSKD_USERNAME = { description = "Web UI user", required = true }
SLSKD_PASSWORD = { description = "Web UI password", required = true }
SLSKD_SLSK_USERNAME = { description = "Soulseek user", required = true }
SLSKD_SLSK_PASSWORD = { description = "Soulseek password", required = true }
SERVER_HOSTNAME = { description = "The server's hostname, where shadowsocks listens", required = true }
SHADOWSOCKS_PORT = { description = "shadowsocks port on the server (server/shadowsocks)", required = true }
SHADOWSOCKS_PASSWORD = { description = "shadowsocks key, equal on the server", required = true }
