---
# sslocal in slskd's pod: plain SOCKS5 on localhost:1080 for slskd, each
# connection carried encrypted to shadowsocks on the server (server/shadowsocks).
apiVersion: v1
kind: Secret
metadata:
  name: sslocal-config
stringData:
  config.json: |
    {
      "server": "${SERVER_HOSTNAME}",
      "server_port": ${SHADOWSOCKS_PORT},
      "password": "${SHADOWSOCKS_PASSWORD}",
      "method": "2022-blake3-aes-256-gcm",
      "local_address": "127.0.0.1",
      "local_port": 1080,
      "protocol": "socks",
      "mode": "tcp_only"
    }
