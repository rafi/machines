---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# https://docs.atuin.sh/latest/self-hosting/server-setup/
# Shell history sync server. Clients encrypt history with their own key
# before upload; the server only stores it. Registration is closed: accounts
# are made as in docs/usage.md (Atuin accounts).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atuin
spec:
  chartRef:
    kind: OCIRepository
    name: atuin
  interval: 1h
  values:
    controllers:
      atuin:
        # One instance: the SQLite database is on a hostPath.
        strategy: Recreate
        # Runs as atuin (1000:1000); /opt/atuin on the node must be owned by
        # it (fsGroup doesn't chown a hostPath).
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
        containers:
          app:
            image:
              repository: ghcr.io/atuinsh/atuin
              tag: 18.24.2@sha256:d739b1f19ffee44f05c681cd3f9262d90e2da0ff51b15f23661a8d29f2d3f3c2
            args:
              - start
            env:
              ATUIN_HOST: 0.0.0.0
              ATUIN_PORT: &port 8888
              ATUIN_OPEN_REGISTRATION: "false"
              # The image's ATUIN_CONFIG_DIR is /config; atuin writes an
              # example server.toml there on first start.
              ATUIN_DB_URI: sqlite:///config/atuin.db
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - atuin.${SECRET_DOMAIN}
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
            sectionName: websecure
        # No Authelia: the atuin client calls the API directly and logs in
        # with its own account.
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: hostPath
        hostPath: /opt/atuin
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /config
      # SQLite's temporary files, on a read-only root.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
