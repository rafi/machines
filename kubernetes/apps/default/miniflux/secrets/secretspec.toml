#:schema https://secretspec.dev/schema/secretspec.schema.json
# Values come from pass (secretspec/machines/default/<KEY>).

[project]
name = "machines"
revision = "1.0"

[profiles.default]
MINIFLUX_ADMIN_USERNAME = { description = "Admin user", required = true }
MINIFLUX_ADMIN_PASSWORD = { description = "Admin password", required = true }
MINIFLUX_DATABASE_URL = { description = "postgres:// URL with the pg-miniflux password", required = true }
