---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# https://gethomepage.dev/configs/
# Start page at home.<domain>/, behind Authelia. Its services are the
# HTTPRoutes annotated `gethomepage.dev/enabled: "true"` (name, group, icon
# and widget in more gethomepage.dev/ annotations); each one's status, CPU
# and memory come from the pods labelled app.kubernetes.io/name=<the route's
# name, or its gethomepage.dev/app>. The ClusterRole lets it read routes,
# pods, nodes and their metrics (k3s' metrics-server).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  chartRef:
    kind: OCIRepository
    name: homepage
  interval: 1h
  values:
    controllers:
      homepage:
        pod:
          # The chart's default is false; Homepage talks to the API server.
          automountServiceAccountToken: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.8.0
            env:
              # Next.js listens on $HOSTNAME; the pod network is IPv4 only.
              HOSTNAME: 0.0.0.0
              # Any other Host header gets a 400 (localhost:3000 is always allowed).
              HOMEPAGE_ALLOWED_HOSTS: home.${SECRET_DOMAIN}
              # Not also to a file under /app/config/logs.
              LOG_TARGETS: stdout
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: &port 3000
                    httpHeaders:
                      - name: Host
                        value: localhost:3000
              readiness: *probe
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      app:
        ports:
          http:
            port: *port
    # More specific paths on home.<domain> (/miniflux, /slsk) stay with
    # their own routes.
    route:
      app:
        hostnames:
          - home.${SECRET_DOMAIN}
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
            sectionName: websecure
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authelia
            backendRefs:
              - identifier: app
                port: *port
    # Read-only, cluster-wide: discovery (httproutes; gateways for the
    # listener's scheme), pod status and the cluster and node widgets.
    rbac:
      roles:
        homepage:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: [namespaces, pods, nodes]
              verbs: [get, list]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [httproutes, gateways]
              verbs: [get, list]
            - apiGroups: [metrics.k8s.io]
              resources: [nodes, pods]
              verbs: [get, list]
      bindings:
        homepage:
          type: ClusterRoleBinding
          roleRef:
            identifier: homepage
          subjects:
            - identifier: homepage
    configMaps:
      config:
        data:
          kubernetes.yaml: |
            mode: cluster
            ingress: false
            gateway: true
          settings.yaml: |
            title: Home
            # Renovate bumps the image.
            disableUpdateCheck: true
            theme: dark
            color: slate
            headerStyle: boxedWidgets
            cardStyle: hairline
            blockStyle: refined
            # Monospace numbers only, so values line up.
            font: plexData
            # A dot for pod status instead of "RUNNING".
            statusStyle: dot
            # Typing anywhere on the page filters the tiles, or searches.
            quicklaunch:
              searchDescriptions: true
            # Order of the groups: Cluster from services.yaml, Links from
            # bookmarks.yaml, the others named by gethomepage.dev/group.
            layout:
              Cluster:
                style: row
                columns: 1
              Apps:
              Monitoring:
              Admin:
              Links:
          widgets.yaml: |
            # The cluster only: with one node, its node row is the same.
            - kubernetes:
                cluster:
                  show: true
                  cpu: true
                  memory: true
                nodes:
                  show: false
            - search:
                provider: google
                target: _blank
            # No coordinates: the browser's location (it asks once per
            # device), so the home address stays out of git.
            - openmeteo:
                units: metric
                cache: 15
            - datetime:
                text_size: xl
                format:
                  dateStyle: medium
                  timeStyle: short
                  hourCycle: h23
          # The apps are discovered from their routes; only the health tile,
          # which belongs to no app, is listed here. Each query reads 0 when
          # all is well; Last backup is restic's last successful run.
          services.yaml: |
            - Cluster:
                - Health:
                    icon: mdi-heart-pulse
                    href: https://alertmanager.${SECRET_DOMAIN}
                    widget:
                      type: prometheusmetric
                      url: http://kube-prometheus-stack-prometheus.o11y.svc.cluster.local:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Firing alerts
                          query: count(ALERTS{alertstate="firing", alertname!~"Watchdog|InfoInhibitor"}) or vector(0)
                        - label: Flux not ready
                          query: count(gotk_resource_info{ready!="True"}) or vector(0)
                        - label: Probes down
                          query: count(probe_success == 0) or vector(0)
                        - label: Last backup
                          query: kube_cronjob_status_last_successful_time{cronjob="restic"}
                          format:
                            type: relativeDate
                            scale: 1000
                      # Red when not 0, or when the nightly backup is a day old.
                      highlight:
                        Firing alerts: &nonzero
                          numeric:
                            - level: danger
                              when: gt
                              value: 0
                        Flux not ready: *nonzero
                        Probes down: *nonzero
                        Last backup:
                          string:
                            - level: danger
                              when: regex
                              value: day|week|month|year
          # Descriptions replace the default (the link's host name), which
          # the narrow column cuts.
          bookmarks.yaml: |
            - Links:
                - machines:
                    - icon: si-github-#e2e8f0
                      href: https://github.com/rafi/machines
                      description: GitHub
                - Pull requests:
                    - icon: si-renovate-#e2e8f0
                      href: https://github.com/rafi/machines/pulls
                      description: Renovate
                - Actions:
                    - icon: si-githubactions-#2088ff
                      href: https://github.com/rafi/machines/actions
                      description: CI
                - Cloudflare:
                    - icon: si-cloudflare-#f38020
                      href: https://dash.cloudflare.com
                      description: DNS
                - Backblaze:
                    - icon: si-backblaze-#e21e29
                      href: https://secure.backblaze.com/b2_buckets.htm
                      description: B2
                - DigitalOcean:
                    - icon: si-digitalocean-#0080ff
                      href: https://cloud.digitalocean.com/droplets
                      description: Server
    persistence:
      # Homepage copies a sample of each config file it doesn't find into
      # /app/config; the root filesystem is read-only.
      config:
        type: emptyDir
        globalMounts:
          - path: /app/config
      config-files:
        type: configMap
        identifier: config
        globalMounts:
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
          - path: /app/config/settings.yaml
            subPath: settings.yaml
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
          - path: /app/config/services.yaml
            subPath: services.yaml
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
