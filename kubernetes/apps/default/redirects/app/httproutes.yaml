---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# init.<domain>/ → the machine setup script (`curl -L init.<domain> | sh`).
# Other paths: 404, as on the server before.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: init
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - init.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: github.com
            path:
              type: ReplaceFullPath
              replaceFullPath: /rafi/awesome-cli-binaries/raw/refs/heads/master/sync.lib.sh
            statusCode: 301
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# req.<domain>/ → the Seerr instance (SEERR_HOSTNAME in cluster-settings).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: req
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - req.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: ${SEERR_HOSTNAME}
            statusCode: 301
