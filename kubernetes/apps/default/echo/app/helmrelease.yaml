---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# https://github.com/home-operations/echo
# Echoes each request back as JSON. The chart runs it as 65532 with a
# read-only root filesystem; its route can't add filters, so the route with
# Authelia is httproute.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo
spec:
  chartRef:
    kind: OCIRepository
    name: echo
  interval: 1h
  values:
    config:
      # The pod, namespace and node in each response.
      kubernetes: true
      # Traefik's pod address (k3s's pod CIDR): its X-Forwarded-For names the client.
      trustedProxies:
        - 10.42.0.0/16
      # Nothing scrapes it.
      metricsEnabled: false
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
