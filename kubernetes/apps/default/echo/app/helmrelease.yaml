---
# https://github.com/cilium/echoserver
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo
spec:
  chartRef:
    kind: OCIRepository
    name: echo
  interval: 1h
  values:
    controllers:
      echo:
        containers:
          app:
            image:
              repository: cilium/echoserver
              # The image the cluster already runs: `latest` is a later build
              # than the last version tag (1.10.3) and differs from it.
              tag: latest@sha256:76120aab2583d2283578dfbd3025057f874f12893475db0c1a945d7be211e7f4
            probes:
              liveness:
                enabled: true
            resources:
              requests:
                cpu: 4m
                memory: 14Mi
              limits:
                memory: 32Mi
    service:
      app:
        ports:
          http:
            port: 80
    route:
      app:
        hostnames:
          - echo.${SECRET_DOMAIN}
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
            sectionName: web
