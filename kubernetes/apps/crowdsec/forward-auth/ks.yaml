---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Middleware `authelia` in this namespace (kubernetes/components/forward-auth).
# Its kind comes with Traefik's CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forward-auth
spec:
  dependsOn:
    - name: traefik
      namespace: traefik
  interval: 1h
  path: ./kubernetes/apps/crowdsec/forward-auth/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: crowdsec
