---
# Traefik's access log.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-log-reader
  namespace: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crowdsec-log-reader
subjects:
  - kind: ServiceAccount
    name: crowdsec-agent
    namespace: crowdsec
---
# Authelia's login attempts.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-log-reader
  namespace: auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crowdsec-log-reader
subjects:
  - kind: ServiceAccount
    name: crowdsec-agent
    namespace: crowdsec
