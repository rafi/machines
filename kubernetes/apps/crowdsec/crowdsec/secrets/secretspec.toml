#:schema https://secretspec.dev/schema/secretspec.schema.json
# Values come from pass (secretspec/machines/default/<KEY>).

[project]
name = "machines"
revision = "1.0"

[profiles.default]
CROWDSEC_BOUNCER_KEY = { description = "API key of Traefik's bouncer (also in traefik/traefik/secrets)", required = true }
CROWDSEC_WEB_UI_PASSWORD = { description = "Password of the web UI's LAPI watcher", required = true }
