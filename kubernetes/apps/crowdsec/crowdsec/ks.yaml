---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec
spec:
  interval: 1h
  path: ./kubernetes/apps/crowdsec/crowdsec/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: crowdsec
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Lets the agent read the logs of the pods it watches, in their own
# namespaces: no targetNamespace, each RoleBinding names its namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec-log-access
spec:
  interval: 1h
  path: ./kubernetes/apps/crowdsec/crowdsec/log-access
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
