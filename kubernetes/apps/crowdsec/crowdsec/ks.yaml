---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec
spec:
  interval: 1h
  path: ./kubernetes/apps/crowdsec/crowdsec/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: crowdsec
  # Not `wait: true`, which ignores healthChecks: the HelmRelease only goes
  # Ready once, so a later broken pod went unnoticed. These run at every
  # reconcile (hourly, and when Flux starts after a reboot) and fail to
  # Telegram. The agent breaks after a node reboot (helm-charts#252); the fix
  # is in kubernetes/README.md, Troubleshooting.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: crowdsec
      namespace: crowdsec
    - apiVersion: apps/v1
      kind: Deployment
      name: crowdsec-lapi
      namespace: crowdsec
    - apiVersion: apps/v1
      kind: Deployment
      name: crowdsec-agent
      namespace: crowdsec
  timeout: 5m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Lets the agent read the logs of the pods it watches, in their own
# namespaces: no targetNamespace, each RoleBinding names its namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec-log-access
spec:
  interval: 1h
  path: ./kubernetes/apps/crowdsec/crowdsec/log-access
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
