---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-env
stringData:
  AUTHELIA_AUTHENTICATION_BACKEND_LDAP_BASE_DN: ${LLDAP_LDAP_BASE_DN}
  AUTHELIA_AUTHENTICATION_BACKEND_LDAP_USER: uid=bind_user,ou=people,${LLDAP_LDAP_BASE_DN}
  # The same key lldap's bootstrap sets bind_user's password from.
  AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD: ${LLDAP_BIND_USER_PASSWORD}
  AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}
  AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
  AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
  AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${POSTGRES_AUTHELIA_PASSWORD}
