#:schema https://secretspec.dev/schema/secretspec.schema.json
# Values come from pass (secretspec/machines/default/<KEY>).

[project]
name = "machines"
revision = "1.0"

[profiles.default]
LLDAP_BIND_USER_PASSWORD = { description = "Password of lldap's bind_user (Authelia binds as it)", required = true }
AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET = { description = "Password reset JWT secret", required = true }
AUTHELIA_SESSION_SECRET = { description = "Session secret", required = true }
AUTHELIA_STORAGE_ENCRYPTION_KEY = { description = "Encrypts sensitive columns in the authelia database", required = true }
POSTGRES_AUTHELIA_PASSWORD = { description = "Password of the authelia database role (db/postgres)", required = true }
LLDAP_LDAP_BASE_DN = { description = "LDAP base DN, e.g. dc=example,dc=com", required = true }
