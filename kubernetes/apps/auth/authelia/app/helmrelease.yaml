---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# https://www.authelia.com
# Login for every protected site: Traefik's `authelia` ForwardAuth Middleware
# calls it, and its portal is auth.<domain> (no login in front, it is the
# login). Users come from lldap; storage is the authelia database in
# db/postgres. Secret authelia-env: `just kube secrets authelia`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
spec:
  chartRef:
    kind: OCIRepository
    name: authelia
  interval: 1h
  values:
    controllers:
      authelia:
        annotations:
          reloader.stakater.com/auto: "true"
        # Not root: the image's entrypoint then runs authelia directly instead
        # of trying to chown the read-only /config mount.
        pod:
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            fsGroup: 65534
        containers:
          app:
            image:
              repository: ghcr.io/authelia/authelia
              tag: 4.39.28
            envFrom:
              - secretRef:
                  name: authelia-env
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 9091
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: authelia
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - auth.${SECRET_DOMAIN}
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
            sectionName: websecure
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: configMap
        name: authelia-config
        globalMounts:
          - path: /config/configuration.yml
            subPath: configuration.yml
            readOnly: true
      data:
        type: emptyDir
        globalMounts:
          - path: /data
