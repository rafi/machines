---
# Users the bootstrap job creates: one <id>.json each, the password a ${KEY}
# from pass (declared in secretspec.toml). Other users are removed, except
# the admin (LLDAP_ADMIN_USERNAME).
apiVersion: v1
kind: Secret
metadata:
  name: lldap-users
stringData:
  bind_user.json: |
    {
      "id": "bind_user",
      "email": "noreply@${SECRET_DOMAIN}",
      "password": "${LLDAP_BIND_USER_PASSWORD}",
      "displayName": "",
      "groups": ["lldap_password_manager"]
    }
---
# Groups the bootstrap job creates; groups not listed here are removed.
apiVersion: v1
kind: Secret
metadata:
  name: lldap-groups
stringData:
  groups.json: |
    {
      "name": "users"
    }
