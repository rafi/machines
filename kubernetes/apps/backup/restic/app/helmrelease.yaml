---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Nightly encrypted backup of the miniflux and authelia databases,
# /opt/slskd, /opt/lldap and /opt/atuin to B2.
# Secret restic-env: `just kube secrets restic`. Restores: kubernetes/README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: restic
spec:
  chartRef:
    kind: OCIRepository
    name: restic
  interval: 1h
  values:
    controllers:
      restic:
        type: cronjob
        cronjob:
          schedule: "0 4 * * *"
          timeZone: Asia/Jerusalem
          concurrencyPolicy: Forbid
          backoffLimit: 0
          successfulJobsHistory: 3
          failedJobsHistory: 3
        # /opt/slskd, /opt/lldap and /opt/atuin are owned by 1000:1000 (the apps' user).
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
        initContainers:
          # Writes /dump/miniflux.dump; exits 0 even on failure so the files
          # are still backed up (backup.sh reports the missing dump).
          dump:
            image:
              # Same major as the database (version.postgresql in db/postgres).
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: "16.15"
            command:
              - sh
              - -c
              - pg_dump --format=custom --compress=0 --file=/dump/miniflux.dump || rm -f /dump/miniflux.dump
            env:
              PGHOST: postgres-rw.db.svc.cluster.local
              PGDATABASE: miniflux
            envFrom:
              - secretRef:
                  name: restic-env
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          # Same for the authelia database: /dump/authelia.dump.
          dump-authelia:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: "16.15"
            command:
              - sh
              - -c
              - pg_dump --format=custom --compress=0 --file=/dump/authelia.dump || rm -f /dump/authelia.dump
            env:
              PGHOST: postgres-rw.db.svc.cluster.local
              PGDATABASE: authelia
              PGUSER: authelia
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: restic-env
                    key: AUTHELIA_PGPASSWORD
            securityContext: *securityContext
        containers:
          app:
            image:
              repository: restic/restic
              tag: 0.19.1
            command:
              - sh
              - /scripts/backup.sh
            env:
              # Temporary packs go to /tmp; the cache starts empty every run.
              RESTIC_CACHE_DIR: /tmp/restic-cache
            envFrom:
              - secretRef:
                  name: restic-env
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
    persistence:
      dump:
        type: emptyDir
        globalMounts:
          - path: /dump
      slskd:
        type: hostPath
        hostPath: /opt/slskd
        hostPathType: Directory
        advancedMounts:
          restic:
            app:
              - path: /data/slskd
                readOnly: true
      script:
        type: configMap
        name: restic-script
        advancedMounts:
          restic:
            app:
              - path: /scripts/backup.sh
                subPath: backup.sh
                readOnly: true
      lldap:
        type: hostPath
        hostPath: /opt/lldap
        hostPathType: Directory
        advancedMounts:
          restic:
            app:
              - path: /data/lldap
                readOnly: true
      atuin:
        type: hostPath
        hostPath: /opt/atuin
        hostPathType: Directory
        advancedMounts:
          restic:
            app:
              - path: /data/atuin
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          restic:
            app:
              - path: /tmp
