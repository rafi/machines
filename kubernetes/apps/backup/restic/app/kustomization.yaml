---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: restic-script
    files:
      - ./backup.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # The script's $VARs are shell variables, not Flux substitutions.
    kustomize.toolkit.fluxcd.io/substitute: disabled
