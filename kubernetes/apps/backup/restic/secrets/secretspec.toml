#:schema https://secretspec.dev/schema/secretspec.schema.json
# Values come from pass (secretspec/machines/default/<KEY>).

[project]
name = "machines"
revision = "1.0"

[profiles.default]
B2_KEY_ID = { description = "B2 application key ID, limited to the backup bucket", required = true }
B2_APPLICATION_KEY = { description = "B2 application key (read and write)", required = true }
RESTIC_REPOSITORY = { description = "s3:https://s3.<region>.backblazeb2.com/<bucket>", required = true }
RESTIC_PASSWORD = { description = "Encrypts the repository; without it the backups are unreadable", required = true }
POSTGRES_MINIFLUX_USERNAME = { description = "miniflux database owner (pg_dump)", required = true }
POSTGRES_MINIFLUX_PASSWORD = { description = "miniflux database owner password (pg_dump)", required = true }
POSTGRES_AUTHELIA_PASSWORD = { description = "authelia database owner password (pg_dump)", required = true }
FLUX_TELEGRAM_BOT_TOKEN = { description = "Telegram bot for failure messages", required = true }
FLUX_TELEGRAM_CHAT_ID = { description = "Telegram chat for failure messages", required = true }
