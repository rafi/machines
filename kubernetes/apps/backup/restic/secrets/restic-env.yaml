---
apiVersion: v1
kind: Secret
metadata:
  name: restic-env
stringData:
  # restic's S3 backend reads B2's key as AWS credentials.
  AWS_ACCESS_KEY_ID: ${B2_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${B2_APPLICATION_KEY}
  RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
  RESTIC_PASSWORD: ${RESTIC_PASSWORD}
  PGUSER: ${POSTGRES_MINIFLUX_USERNAME}
  PGPASSWORD: ${POSTGRES_MINIFLUX_PASSWORD}
  TELEGRAM_BOT_TOKEN: ${FLUX_TELEGRAM_BOT_TOKEN}
  TELEGRAM_CHAT_ID: ${FLUX_TELEGRAM_CHAT_ID}
