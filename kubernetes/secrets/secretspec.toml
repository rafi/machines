#:schema https://secretspec.dev/schema/secretspec.schema.json
# Values come from pass (secretspec/machines/default/<KEY>).

[project]
name = "machines"
revision = "1.0"

[profiles.default]
SECRET_DOMAIN = { description = "Base domain; Flux substitutes ${SECRET_DOMAIN} in every app", required = true }
FLUX_TELEGRAM_CHAT_ID = { description = "Telegram chat that receives Flux alerts", required = true }
RATHOLE_SERVER_SERVICES_SLSKD_PORT = { description = "Soulseek port, forwarded by the server's rathole (slskd)", required = true }
SEERR_HOSTNAME = { description = "Host of the Seerr instance req.<domain> redirects to", required = true }
