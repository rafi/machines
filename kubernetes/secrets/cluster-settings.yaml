---
# Copied into every namespace under ../apps by `just kube secrets`; every
# Flux Kustomization substitutes from it (see ../flux/cluster/ks.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: cluster-settings
  labels:
    # Reconcile Kustomizations as soon as a value changes.
    reconcile.fluxcd.io/watch: Enabled
stringData:
  SECRET_DOMAIN: ${SECRET_DOMAIN}
  # Where req.<domain> redirects (kubernetes/apps/default/redirects).
  SEERR_HOSTNAME: ${SEERR_HOSTNAME}
  # A bare number: it becomes a YAML integer after substitution (Service port).
  RATHOLE_SERVER_SERVICES_SLSKD_PORT: ${RATHOLE_SERVER_SERVICES_SLSKD_PORT}
  # Quoted: a bare number would turn into a YAML integer after substitution.
  FLUX_TELEGRAM_CHAT_ID: '"${FLUX_TELEGRAM_CHAT_ID}"'
