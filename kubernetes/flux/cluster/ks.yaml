---
# Applies kubernetes/apps: one directory per namespace, each listing its
# namespace and the Flux Kustomizations (ks.yaml) of its apps.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  patches:
    # Every app Kustomization substitutes ${SECRET_DOMAIN} from Secret
    # cluster-settings in its own namespace (`just kube secrets` creates it).
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          postBuild:
            substituteFrom:
              - kind: Secret
                name: cluster-settings
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
