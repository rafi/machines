---
name: ingress

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6.0
    network_mode: host
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro

  acme-companion:
    image: nginxproxy/acme-companion:2.4
    environment:
      - DEFAULT_EMAIL=${CERT_DEFAULT_EMAIL}
    volumes_from:
      - nginx-proxy
    volumes:
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro

  whoami:
    image: jwilder/whoami
    expose:
      - "8000"
    environment:
      - VIRTUAL_HOST=${ECHO_DOMAIN}
      - VIRTUAL_PORT=8000
