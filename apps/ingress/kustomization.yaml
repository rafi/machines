# INGRESS-NGINX

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: ingress

resources:
- kube/namespace.yaml
  # - kube/example-com-https.yaml
  # - kube/example-com-sso.yaml

# labels:
# - includeSelectors: true
#   pairs:
#     app: ingress

helmGlobals:
  chartHome: ../../.helm

helmCharts:
- name: ingress-nginx
  namespace: ingress
  releaseName: ingress
  repo: https://kubernetes.github.io/ingress-nginx
  valuesFile: values.yaml
  version: 4.15.1
