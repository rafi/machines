---
# INGRESS-NGINX Helm chart values
# https://github.com/kubernetes/ingress-nginx/blob/main/charts/ingress-nginx/values.yaml
# https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/

fullnameOverride: nginx

namespaceOverride: ingress

controller:
  kind: Deployment

  hostNetwork: false
  # dnsPolicy: ClusterFirstWithHostNet

  service:
    type: ClusterIP

  allowSnippetAnnotations: true

  # proxySetHeaders:
  #   X-Forwarded-Proto: https

  config:
    # allow-snippet-annotations: "true"  # Creates an error
    force-ssl-redirect: "false"
    global-auth-always-set-cookie: "true"
    server-tokens: "false"
    # As this ingress is a proxy to rathole, let's forward all headers.
    use-forwarded-headers: "true"

defaultBackend:
  enabled: false
