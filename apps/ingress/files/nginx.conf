user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

# Plain HTTP only redirects to HTTPS; every site's TLS ends in the cluster
# (snippets/stream.nginx).
http {
	server_tokens off;
	access_log /var/log/nginx/access.log;

	server {
		listen 80 default_server;
		return 301 https://$host$request_uri;
	}
}

include /etc/nginx/snippets/stream.nginx;

