#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "machines"
revision = "1.0"

[profiles.default]
AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD = { description = "LDAP bind password", required = true }
AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET = { description = "Password reset JWT secret", required = true }
AUTHELIA_SESSION_SECRET = { description = "Session secret", required = true }
AUTHELIA_STORAGE_ENCRYPTION_KEY = { description = "Storage encryption key", required = true }
AUTHELIA_AUTHENTICATION_BACKEND_LDAP_ADDRESS = { description = "LDAP server address", default = "ldap://127.0.0.1:3890" }
AUTHELIA_SERVER_DISABLE_HEALTHCHECK = { description = "Disable the built-in healthcheck", default = "true" }
SECRET_DOMAIN = { description = "Base domain", required = true }
LLDAP_LDAP_BASE_DN = { description = "LDAP base DN, e.g. dc=example,dc=com", required = true }
