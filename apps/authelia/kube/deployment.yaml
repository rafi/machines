---
# AUTHELIA

apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
spec:
  selector: {}
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 0
  strategy:
    type: Recreate
  template:
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      enableServiceLinks: false
      containers:
      - name: authelia
        image: ghcr.io/authelia/authelia
        imagePullPolicy: IfNotPresent
        command: ["authelia"]
        args:
        - --config=/configuration.yml
        # resources:
        #   limits: {}
        #   requests: {}
        env:
        - name: AUTHELIA_SERVER_DISABLE_HEALTHCHECK
          value: "true"
        - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_ADDRESS
          value: ldap://lldap-ldap:3890
        - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
          value: /secrets/IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
        - name: AUTHELIA_SESSION_SECRET_FILE
          value: /secrets/SESSION_SECRET
        - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE
          value: /secrets/AUTHENTICATION_BACKEND_LDAP_PASSWORD
        - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
          value: /secrets/STORAGE_ENCRYPTION_KEY
        startupProbe:
          failureThreshold: 6
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /api/health
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        ports:
        - name: http
          containerPort: 9091
          protocol: TCP
        volumeMounts:
        - mountPath: /config
          name: authelia
          readOnly: false
        - mountPath: /configuration.yml
          name: config
          readOnly: true
          subPath: configuration.yml
        - mountPath: /secrets
          name: secrets
          readOnly: true
      volumes:
      - name: authelia
        persistentVolumeClaim:
          claimName: authelia
      - name: config
        configMap:
          name: authelia-conf
          items:
          - key: configuration.yml
            path: configuration.yml
      - name: secrets
        secret:
          secretName: authelia
          items:
          - key: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD
            path: AUTHENTICATION_BACKEND_LDAP_PASSWORD
          - key: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
            path: IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
          - key: AUTHELIA_SESSION_SECRET
            path: SESSION_SECRET
          - key: AUTHELIA_STORAGE_ENCRYPTION_KEY
            path: STORAGE_ENCRYPTION_KEY
