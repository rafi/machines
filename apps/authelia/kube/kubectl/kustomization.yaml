# AUTHELIA
# https://github.com/authelia/authelia

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: auth

resources:
  - ../base

images:
- name: ghcr.io/authelia/authelia
  newTag: 4.38.7

labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: rafi-machines
    app.kubernetes.io/name: authelia
    critical: "true"
    env: home

secretGenerator:
- envs:
  - ../../.env
  name: authelia

configMapGenerator:
- files:
  - ../../systemd/files/configuration.yml
  name: authelia-conf

replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=authelia].image
    kind: Deployment
    options:
      delimiter: ':'
      index: 1
  targets:
  - fieldPaths:
    - metadata.labels.[app.kubernetes.io/version]
    - spec.template.metadata.labels.[app.kubernetes.io/version]
    options:
      create: true
    select:
      kind: Deployment
      name: authelia
