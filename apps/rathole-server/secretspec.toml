#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "machines"
revision = "1.0"

[profiles.default]
RATHOLE_DEFAULT_TOKEN = { description = "Rathole server default_token", required = true }
RATHOLE_SERVER_BIND_PORT = { description = "Rathole server bind_addr port only", required = true }
RATHOLE_SERVER_PKCS12 = { description = "Rathole server pkcs12 (certificate path on the host)", required = true }
RATHOLE_SERVER_PKCS12_PASSWORD = { description = "Rathole server pkcs12_password", required = true }
RATHOLE_SERVER_SERVICES_INGRESS_PORT = { description = "Rathole server.services.ingress.bind_addr port", required = true }
RATHOLE_SERVER_SERVICES_SSH_PORT = { description = "Rathole server.services.ssh.bind_addr port", required = true }
RATHOLE_SERVER_SERVICES_SLSKD_PORT = { description = "Rathole server.services.slskd.bind_addr port", required = true }
APP_VERSION = { description = "Rathole release to install (installer default applies if unset)", required = false }
