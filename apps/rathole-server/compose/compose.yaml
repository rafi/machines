---
# RATHOLE server docker-compose spec
# See: https://github.com/rapiz1/rathole

name: rathole

services:
  server:
    image: rapiz1/rathole:v0.5.0
    command: --server /etc/rathole/server.toml
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: always
    # dns:
    #   - 8.8.8.8
    #   - 9.9.9.9
    secrets:
      - source: cert
        target: /etc/rathole/certs/identity.pfx
        uid: "0"
        gid: "0"
        mode: 0400
    volumes:
      - type: bind
        source: ../files/server.toml
        target: /etc/rathole/server.toml
        read_only: true

secrets:
  cert:
    file: ../files/identity.pfx
