---
# RATHOLE
# https://github.com/rapiz1/rathole

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: ingress

resources:
  - kube/deployment.yaml
  - kube/service.yaml

images:
  - name: rapiz1/rathole
    newTag: "v0.5.0"

labels:
  - includeSelectors: true
    pairs:
      app: rathole
      instance: server

configMapGenerator:
  - name: rathole-conf
    files:
      - files/server.toml

# See: bin/create-self-signed-cert.sh
secretGenerator:
  - name: rathole
    files:
      - tls/identity.pfx
