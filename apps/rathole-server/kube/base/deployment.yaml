---
# RATHOLE server kubernetes deployment
# See: https://github.com/rapiz1/rathole

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rathole-server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  template:
    spec:
      restartPolicy: Always
      containers:
      - name: server
        image: rapiz1/rathole
        imagePullPolicy: IfNotPresent
        args:
        - --server
        - /etc/rathole/rathole.toml
        # The ${VAR} ports are substituted at deploy time; keep them all equal
        # to the bind_addr ports in rathole.toml.
        ports:
        - containerPort: ${RATHOLE_SERVER_BIND_PORT}
          name: tcp
        - containerPort: 32000
          name: ingress
        - containerPort: 32022
          name: ssh
        - containerPort: ${RATHOLE_SERVER_SERVICES_SLSKD_PORT}
          name: slskd
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        readinessProbe:
          tcpSocket:
            port: tcp
          initialDelaySeconds: 2
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 60
        # TODO: this pollutes logs with errors.
        #       Find out how to do ot properly.
        # livenessProbe:
        #   tcpSocket:
        #     port: tcp
        #   initialDelaySeconds: 2
        #   timeoutSeconds: 5
        #   successThreshold: 1
        #   failureThreshold: 3
        #   periodSeconds: 60
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime
        # A single file, so the certs mount isn't nested in a read-only volume.
        - name: conf
          mountPath: /etc/rathole/rathole.toml
          subPath: rathole.toml
        - name: certs
          mountPath: /etc/rathole/certs

      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/UTC
        - name: conf
          secret:
            secretName: rathole-conf
        - name: certs
          secret:
            secretName: rathole
