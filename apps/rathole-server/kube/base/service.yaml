---
apiVersion: v1
kind: Service
metadata:
  name: rathole-server
spec:
  type: ClusterIP
  ports:
  # The address that the server listens for clients.
  # If using nginx, route this port to rathole-server with a TCP stream.
  - port: ${RATHOLE_SERVER_BIND_PORT}
    name: tcp
    protocol: TCP
    targetPort: tcp
  - port: ${RATHOLE_SERVER_SERVICES_INGRESS_PORT}
    name: ingress
    protocol: TCP
    targetPort: ingress
  - port: ${RATHOLE_SERVER_SERVICES_SSH_PORT}
    name: ssh
    protocol: TCP
    targetPort: ssh
  - port: ${RATHOLE_SERVER_SERVICES_SLSKD_PORT}
    name: slskd
    protocol: TCP
    targetPort: slskd
