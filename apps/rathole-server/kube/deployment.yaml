---
# RATHOLE server
# See: https://github.com/rapiz1/rathole

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rathole-server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  template:
    spec:
      restartPolicy: Always
      containers:
      - name: server
        image: rapiz1/rathole
        imagePullPolicy: IfNotPresent
        args:
        - --server
        - /etc/rathole/rathole.toml
        ports:
        - containerPort: 23123
          name: tcp
        - containerPort: 12000
          name: ingress
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        readinessProbe:
          tcpSocket:
            port: 23123
          initialDelaySeconds: 2
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 60
        # TODO: this pollutes logs with errors.
        #       Find out how to do ot properly.
        # livenessProbe:
        #   tcpSocket:
        #     port: 23123
        #   initialDelaySeconds: 2
        #   timeoutSeconds: 5
        #   successThreshold: 1
        #   failureThreshold: 3
        #   periodSeconds: 60
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime
        - name: conf
          mountPath: /etc/rathole
        - name: tls
          mountPath: /etc/rathole/certs

      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/UTC
        - name: conf
          configMap:
            name: rathole-conf
        - name: tls
          secret:
            secretName: rathole
