---
apiVersion: v1
kind: Service
metadata:
  name: rathole-server
spec:
  type: ClusterIP
  ports:
  # The address that the server listens for clients.
  # If using nginx, see _remote_ nginx tcp configmap:  "23123": ingress/rathole-server:23123
  - port: 23123
    name: tcp
    protocol: TCP
    targetPort: tcp
  - port: 12000
    name: ingress
    protocol: TCP
    targetPort: ingress
