---
# RATHOLE
# https://github.com/rapiz1/rathole
#
# `just deploy kube rathole-server` with EXTRA_FILES holding identity.pfx
# (see bin/create-self-signed-cert.sh). server.toml is rendered from
# ../../systemd/files/server.example.toml, and the ${RATHOLE_*} ports in
# ../base are substituted, from secretspec.toml.
# RATHOLE_SERVER_PKCS12 must be /etc/rathole/certs/identity.pfx.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: rathole

resources:
  - ../base

images:
  - name: rapiz1/rathole
    newTag: "v0.5.0"

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: rafi-machines
      app.kubernetes.io/name: rathole-server

secretGenerator:
  # Holds default_token, so a Secret rather than a ConfigMap.
  - name: rathole-conf
    files:
      - rathole.toml=../../systemd/files/server.toml
  - name: rathole
    files:
      - ../../systemd/files/identity.pfx

replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=server].image
    kind: Deployment
    options:
      delimiter: ':'
      index: 1
  targets:
  - fieldPaths:
    - metadata.labels.[app.kubernetes.io/version]
    - spec.template.metadata.labels.[app.kubernetes.io/version]
    options:
      create: true
    select:
      kind: Deployment
      name: rathole-server
