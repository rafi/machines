# See https://github.com/rapiz1/rathole#configuration
# FIXME: https://github.com/rapiz1/rathole/issues/218
# Rendered by `just deploy systemd|kube` with the values in ../../secretspec.toml.
[server]
bind_addr = "0.0.0.0:${RATHOLE_SERVER_BIND_PORT}"
default_token = "${RATHOLE_DEFAULT_TOKEN}"

[server.transport]
type = "tls"
[server.transport.tls]
pkcs12 = "${RATHOLE_SERVER_PKCS12}"
pkcs12_password = "${RATHOLE_SERVER_PKCS12_PASSWORD}"

# The service name must be identical to the client side.
# ingress and ssh are only reached on the server itself (nginx's http and
# stream upstreams use the same literal ports); ufw keeps them closed.
[server.services.ingress]
# type = "tcp"
bind_addr = "0.0.0.0:32000"
# nodelay = true

[server.services.ssh]
bind_addr = "0.0.0.0:32022"

[server.services.slskd]
bind_addr = "0.0.0.0:${RATHOLE_SERVER_SERVICES_SLSKD_PORT}"

# Authelia in the cluster, for nginx's auth_request and the auth.<domain>
# portal: loopback only, no ufw rule. Authelia's own port, so nginx's
# upstream (127.0.0.1:9091) stays the same.
[server.services.authelia]
bind_addr = "127.0.0.1:9091"
