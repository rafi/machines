---
# POSTGRES (CloudNativePG cluster)
# Requires the operator from apps/cloudnative-pg.
# Namespace `db` and per-database Secrets come from the consuming repo.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: db

resources:
  - kube/helm.yaml

configMapGenerator:
  - name: postgres-values
    files:
      - values.yaml
