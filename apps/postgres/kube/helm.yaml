---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
spec:
  interval: 1h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
spec:
  interval: 10m
  chart:
    spec:
      chart: cluster
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: cnpg
  valuesFrom:
    - kind: ConfigMap
      name: postgres-values
      valuesKey: values.yaml
