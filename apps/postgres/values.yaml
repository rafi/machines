# CloudNativePG `cluster` chart values
# https://github.com/cloudnative-pg/charts/tree/main/charts/cluster
#
# Generic only. Which databases exist (cluster.roles, databases and
# cluster.initdb) is selected per cluster by patching the HelmRelease from
# the presets repo; passwords live there as sops-encrypted Secrets.

# Service: postgres-rw.db.svc.cluster.local
fullnameOverride: postgres

cluster:
  instances: 1
  # A PDB on a single instance would block node drains.
  enablePDB: false
  # Superuser has no password (peer auth in-pod only); apps use owner roles.
  enableSuperuserAccess: false
  storage:
    size: 8Gi
  monitoring:
    enabled: false
    podMonitor:
      enabled: false
    prometheusRule:
      enabled: false
