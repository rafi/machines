---
# POSTGRESQL Helm chart values
# https://github.com/bitnami/charts/blob/main/bitnami/postgresql/values.yaml

fullnameOverride: postgres

image:
  repository: bitnami/postgresql
  tag: 16.2.0-debian-12-r15

auth:
  username: rafi
  existingSecret: postgres-env
  secretKeys:
    adminPasswordKey: PG_POSTGRES_PASSWORD
    userPasswordKey: PG_USER_PASSWORD
    replicationPasswordKey: PG_REPLICATION_PASSWORD

readReplicas:
  replicaCount: 0

primary:
  extraEnvVarsSecret: postgres-env
  initdb:
    scriptsConfigMap: postgres-scripts
