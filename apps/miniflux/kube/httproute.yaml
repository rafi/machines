---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: miniflux
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: web
  hostnames:
  - ${MINIFLUX_HOST_NAME}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /miniflux
    backendRefs:
    - name: miniflux
      port: 8080
