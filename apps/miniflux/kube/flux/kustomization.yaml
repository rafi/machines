---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

# Secret `miniflux-env` (envFrom in the Deployment) is provided by the
# consuming repo, sops-encrypted. Keys: see .env.example.

resources:
  - ../base

images:
  - name: ghcr.io/miniflux/miniflux
    newTag: "2.1.4"

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: cluster
      app.kubernetes.io/managed-by: rafi-machines
      app.kubernetes.io/name: miniflux
      critical: "false"
      env: home

replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=miniflux].image
    kind: Deployment
    options:
      delimiter: ':'
      index: 1
  targets:
  - fieldPaths:
    - metadata.labels.[app.kubernetes.io/version]
    - spec.template.metadata.labels.[app.kubernetes.io/version]
    options:
      create: true
    select:
      kind: Deployment
      name: miniflux
