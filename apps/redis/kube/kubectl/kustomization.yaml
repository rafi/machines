---
# REDIS

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: db

helmGlobals:
  chartHome: ../../../../.helm

helmCharts:
  - name: redis
    repo: oci://registry-1.docker.io/bitnamicharts
    version: "19.1.0"
    releaseName: redis
    namespace: db
    valuesFile: values.yaml
