---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: paperless-ngx-data
spec:
  accessModes: [ ReadWriteOnce ]
  resources:
    requests:
      storage: "1Gi"

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: paperless-ngx-media
spec:
  accessModes: [ ReadWriteOnce ]
  resources:
    requests:
      storage: "8Gi"
