---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slskd
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
    sectionName: web
  hostnames:
  - ${SLSKD_HOST_NAME}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /slsk
    backendRefs:
    - name: slskd
      port: 80
