---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

# Provided by the consuming repo:
#   Secret `slskd-env` (envFrom in the Deployment), sops-encrypted.
#     Keys: see .env.example.
#   ConfigMap `slskd` (slskd.yml, mounted in the Deployment).
# HTTPRoute host: ${SLSKD_HOST_NAME}, substituted by Flux postBuild.

resources:
  - ../base

images:
  - name: slskd/slskd
    newTag: "0.26.1"

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: cluster
      app.kubernetes.io/managed-by: rafi-machines
      app.kubernetes.io/name: slskd
      critical: "false"
      env: home

replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=slskd].image
    kind: Deployment
    options:
      delimiter: ':'
      index: 1
  targets:
  - fieldPaths:
    - metadata.labels.[app.kubernetes.io/version]
    - spec.template.metadata.labels.[app.kubernetes.io/version]
    options:
      create: true
    select:
      kind: Deployment
      name: slskd
