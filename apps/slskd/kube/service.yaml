---
apiVersion: v1
kind: Service
metadata:
  name: slskd
spec:
  type: ClusterIP
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 5030
  # Soulseek peer port; exposed publicly through rathole
  - name: listen
    protocol: TCP
    port: ${SLSKD_SLSK_LISTEN_PORT}
    targetPort: ${SLSKD_SLSK_LISTEN_PORT}
