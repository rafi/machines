---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drone-deploy
  namespace: nester

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drone-deploy
  namespace: nester
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get","list","patch","update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drone-deploy
  namespace: nester
subjects:
  - kind: ServiceAccount
    name: drone-deploy
    namespace: nester
roleRef:
  kind: Role
  name: drone-deploy
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: drone-deploy-token
  namespace: nester
  annotations:
    kubernetes.io/service-account.name: drone-deploy
