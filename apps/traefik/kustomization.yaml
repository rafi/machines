# TRAEFIK
# Flux HelmRelease (helm-controller); values.yaml is the single source of values.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: traefik

resources:
- kube/namespace.yaml
- kube/helm.yaml

configMapGenerator:
- name: traefik-values
  files:
  - values.yaml
