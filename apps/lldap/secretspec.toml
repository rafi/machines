#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "machines"
revision = "1.0"

[profiles.default]
LLDAP_VERBOSE = { description = "Verbose logging", default = "false" }
LLDAP_URL = { description = "Internal URL used by the bootstrap job (Service lldap-http)", default = "http://lldap-http:17170" }
LLDAP_HTTP_PORT = { description = "HTTP port", default = "12234" }
LLDAP_HTTP_URL = { description = "Public URL (e.g. https://ldap.example.com)", required = true }
LLDAP_LDAP_BASE_DN = { description = "LDAP base DN (e.g. dc=example,dc=com)", required = true }
DO_CLEANUP = { description = "Bootstrap job: delete users/groups not in the JSON files", default = "false" }
LLDAP_ADMIN_USERNAME = { description = "Admin username", default = "admin" }
LLDAP_ADMIN_PASSWORD = { description = "Admin password", required = true }
LLDAP_LDAP_USER_EMAIL = { description = "Admin email", required = true }
LLDAP_JWT_SECRET = { description = "JWT secret", required = true }
LLDAP_KEY_SEED = { description = "Key seed", required = true }
LLDAP_DATABASE_URL = { description = "Database URL", default = "sqlite:///data/users.db?mode=rwc" }
LLDAP_SMTP_PASSWORD = { description = "SMTP password", required = false }
SECRET_DOMAIN = { description = "Base domain", required = true }
LLDAP_BIND_USER_PASSWORD = { description = "Password of bind_user (Authelia binds as it)", required = true }
