# LLDAP environment variables
# https://github.com/lldap/lldap

verbose = false

http_url = "https://ldap.${SECRET_DOMAIN}"

bootstrap_do_cleanup = false

ldap_base_dn = "${LLDAP_LDAP_BASE_DN}"
ldap_user_dn = "${LLDAP_ADMIN_USERNAME}"
ldap_user_pass = "${LLDAP_ADMIN_PASSWORD}"
ldap_user_email = "${LLDAP_LDAP_USER_EMAIL}"

jwt_secret = "${LLDAP_JWT_SECRET}"
key_seed = "${LLDAP_KEY_SEED}"
# The key comes from key_seed only; an empty key_file stops lldap from also
# looking for a key file (both present aborts startup).
key_file = ""

# Web UI shipped with the release tarball (apps/lldap/systemd/installer.sh).
assets_path = "/opt/lldap/app"

database_url = "sqlite:///var/lib/lldap/users.db?mode=rwc"
smtp_password = "${LLDAP_SMTP_PASSWORD}"
