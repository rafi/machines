---
# LLDAP bootstrap script

# Doc: https://github.com/lldap/lldap/blob/main/example_configs/bootstrap/bootstrap.md
# Script: https://github.com/lldap/lldap/blob/main/scripts/bootstrap.sh

apiVersion: batch/v1
kind: Job
metadata:
  name: lldap-bootstrap
  # Next annotations are required if the job managed by Argo CD,
  # so Argo CD can relaunch the job on every app sync action
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: lldap/bootstrap
          command:
            - ./bootstrap.sh
          env:
            - name: LLDAP_URL
              valueFrom:
                secretKeyRef:
                  name: lldap-env
                  key: LLDAP_URL
            - name: DO_CLEANUP
              valueFrom:
                secretKeyRef:
                  name: lldap-env
                  key: DO_CLEANUP
            - name: LLDAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lldap-env
                  key: LLDAP_ADMIN_USERNAME
            - name: LLDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lldap-env
                  key: LLDAP_ADMIN_PASSWORD
          volumeMounts:
            - name: user-configs
              mountPath: /user-configs
              readOnly: true
            - name: group-configs
              mountPath: /group-configs
              readOnly: true
      volumes:
        - name: user-configs
          secret:
            secretName: lldap-users
        - name: group-configs
          secret:
            secretName: lldap-groups
