---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lldap
automountServiceAccountToken: false

---
apiVersion: v1
kind: Service
metadata:
  name: lldap-http
spec:
  type: ClusterIP
  ports:
    - port: 17170
      targetPort: http
      protocol: TCP
      name: http

---
apiVersion: v1
kind: Service
metadata:
  name: lldap-ldap
spec:
  type: ClusterIP
  ports:
    - port: 3890
      targetPort: ldap
      protocol: TCP
      name: ldap
