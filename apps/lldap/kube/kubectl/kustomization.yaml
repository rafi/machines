---
# LLDAP
# https://github.com/lldap/lldap
#
# Bootstrap users and groups come from ../../files, rendered with the
# secretspec values, as is ${LLDAP_HTTP_PORT} in ../base.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: auth

resources:
  - ../base

images:
  - name: lldap/lldap
    newTag: v0.5.0
  - name: lldap/bootstrap
    newName: lldap/lldap
    newTag: "2024-04-01"

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: rafi-machines
      app.kubernetes.io/name: lldap
      critical: "true"

secretGenerator:
  - name: lldap-env
    envs:
      - ../../.env
  - name: lldap-users
    files:
      - ../../files/bind_user.json
      # Add more users...
      # - ../../files/foo.json
  - name: lldap-groups
    files:
      - ../../files/groups.json

replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=lldap].image
    kind: Deployment
    options:
      delimiter: ':'
      index: 1
  targets:
  - fieldPaths:
    - metadata.labels.[app.kubernetes.io/version]
    - spec.template.metadata.labels.[app.kubernetes.io/version]
    options:
      create: true
    select:
      kind: Deployment
      name: lldap
