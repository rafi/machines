---
# LLDAP
# https://github.com/lldap/lldap

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: auth

resources:
  - ../base

images:
  - name: lldap/lldap
    newTag: v0.5.0
  - name: lldap/bootstrap
    newName: lldap/lldap
    newTag: "2024-04-01"

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: server
      app.kubernetes.io/managed-by: rafi-machines
      app.kubernetes.io/name: lldap
      critical: "true"
      env: home

secretGenerator:
  - name: lldap-env
    envs:
      - ../../.env
  - name: lldap-users
    files:
      - ../../systemd/files/bind_user.json
      # Add more users...
      # - ../../systemd/files/foo.json
  - name: lldap-groups
    files:
      - ../../systemd/files/groups.json

# Instruct Kustomize to copy that value into the container port and route
replacements:
- source:
    kind: Secret
    name: lldap-env
    fieldPath: data.LLDAP_HTTP_PORT
  targets:
  - select:
      kind: Deployment
      name: lldap
    fieldPaths:
    - spec:template:spec:containers.[name=lldap]:ports.[containerPort=12234]:containerPort
    options:
      delimiter: ""
  - select:
      kind: HTTPRoute
      name: lldap
    fieldPaths:
    - spec.rules.0.backendRefs.[name=lldap-http].port
    options:
      delimiter: ""
- source:
    fieldPath: spec.template.spec.containers.[name=lldap].image
    kind: Deployment
    options:
      delimiter: ':'
      index: 1
  targets:
  - fieldPaths:
    - metadata.labels.[app.kubernetes.io/version]
    - spec.template.metadata.labels.[app.kubernetes.io/version]
    options:
      create: true
    select:
      kind: Deployment
      name: lldap
