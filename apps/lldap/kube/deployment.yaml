---
# LLDAP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  template:
    spec:
      securityContext: {}
      serviceAccountName: lldap
      restartPolicy: Always
      containers:
        - name: lldap
          securityContext: {}
          image: lldap/lldap
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: lldap-env
          env:
            - name: uid
              value: "1000"
            - name: gid
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
            - name: LLDAP_LDAP_PORT
              value: "3890"
          ports:
            - name: http
              containerPort: 12234
              protocol: TCP
            - name: ldap
              containerPort: 3890
              protocol: TCP
          # resources: {}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
          - mountPath: /data
            name: data
            readOnly: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: lldap
