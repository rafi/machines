---
# ECHOSERVER
# https://github.com/cilium/echoserver

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: default

resources:
  - ../base

images:
  - name: cilium/echoserver
    newTag: latest

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: cluster
      app.kubernetes.io/managed-by: rafi-machines
      app.kubernetes.io/name: echoserver
      critical: "false"
      env: home

replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=echoserver].image
    kind: Deployment
    options:
      delimiter: ':'
      index: 1
  targets:
  - fieldPaths:
    - metadata.labels.[app.kubernetes.io/version]
    - spec.template.metadata.labels.[app.kubernetes.io/version]
    options:
      create: true
    select:
      kind: Deployment
      name: echoserver
