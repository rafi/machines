---
# ECHOSERVER
# https://github.com/cilium/echoserver

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: default

resources:
  - kube/deployment.yaml
  - kube/ingress.yaml
  - kube/service.yaml

images:
  - name: cilium/echoserver
    newTag: latest

labels:
  - includeSelectors: true
    pairs:
      app: echoserver
      instance: dummy
