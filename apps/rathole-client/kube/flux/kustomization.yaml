---
# RATHOLE
# https://github.com/rapiz1/rathole

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: rathole

resources:
  - ../base

images:
  - name: rapiz1/rathole
    newTag: "v0.5.0"

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: server
      app.kubernetes.io/managed-by: rafi-machines
      app.kubernetes.io/name: rathole-client
      critical: "true"
      env: home

# configMapGenerator:
#   - name: rathole-conf
#     files:
#       - files/client.toml

# See: bin/create-self-signed-cert.sh
# secretGenerator:
#   - name: rathole
#     files:
#       - tls/rootCA.crt

replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=client].image
    kind: Deployment
    options:
      delimiter: ':'
      index: 1
  targets:
  - fieldPaths:
    - metadata.labels.[app.kubernetes.io/version]
    - spec.template.metadata.labels.[app.kubernetes.io/version]
    options:
      create: true
    select:
      kind: Deployment
      name: rathole
