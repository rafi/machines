---
# RATHOLE client
# See: https://github.com/rapiz1/rathole

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rathole
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  template:
    spec:
      restartPolicy: Always
      containers:
      - name: client
        image: rapiz1/rathole
        imagePullPolicy: IfNotPresent
        env:
          - name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        args:
        - --client
        - /etc/rathole/client.toml
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi
        volumeMounts:
        - name: localtime
          mountPath: /etc/localtime
        - name: conf
          mountPath: /etc/rathole
        - name: tls
          mountPath: /etc/rathole/certs

      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/UTC
        - name: conf
          secret:
            secretName: rathole-conf
        - name: tls
          secret:
            secretName: rathole
