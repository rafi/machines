---
# RATHOLE
# https://github.com/rapiz1/rathole

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: rathole

resources:
  - kube/deployment.yaml

images:
  - name: rapiz1/rathole
    newTag: "v0.5.0"

labels:
  - includeSelectors: true
    pairs:
      app: rathole
      instance: client

