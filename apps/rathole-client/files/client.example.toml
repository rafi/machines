# See https://github.com/rapiz1/rathole#configuration
# FIXME: https://github.com/rapiz1/rathole/issues/218
# Currently uses secretspec (see ../justfile)
[client]
remote_addr = "${RATHOLE_REMOTE_HOST}:${RATHOLE_SERVER_BIND_PORT}"
default_token = "${RATHOLE_DEFAULT_TOKEN}"
retry_interval = 3

[client.transport]
type = "tls"
[client.transport.tls]
trusted_root = "${RATHOLE_CLIENT_TRUSTED_ROOT}"
# The hostname that the client uses to validate the certificate.
hostname = "localhost"

# A service that needs forwarding. Must match in server.
[client.services.ingress]
# local_addr = "nginx-controller.ingress:80"
local_addr = "traefik.traefik:80"

[client.services.ssh]
local_addr = "${RATHOLE_CLIENT_SERVICES_SSH_LOCAL_ADDR}"
