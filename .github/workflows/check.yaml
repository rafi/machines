---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Renders the Flux cluster with flate, so a broken manifest or a value a
# chart's schema rejects fails here (and on Renovate's PRs) before Flux
# pulls it. Needs no secrets: the check never reads pass.
name: Check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # The version follows the pinned tag. An empty base renders the whole
      # tree, not only what changed.
      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          base: ""

      - name: Render the Flux cluster
        run: just kube check
