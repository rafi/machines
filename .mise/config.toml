#:schema https://mise.jdx.dev/schema/mise.json
# The CLI tools the recipes and CI run, pinned: `mise install` installs them,
# mise.lock holds their checksums, and Renovate bumps both. pass, gnupg,
# gettext (envsubst), rsync and openssl come from the system or Homebrew.

[settings]
# Install only what mise.lock describes, with its checksums.
locked = true

[tools]
"github:cachix/secretspec" = "0.21.1"
"github:home-operations/flate" = "0.6.5"
flux2 = "2.9.6"
helm = "4.3.1"
jactionlint = "v2.4.0"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
restic = "0.19.1"
shellcheck = "0.11.0"
yq = "4.54.1"
zizmor = "1.31.1"
