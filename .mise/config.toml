#:schema https://mise.jdx.dev/schema/mise.json
# The CLI tools the recipes and CI run, pinned: `mise install` installs them,
# mise.lock holds their checksums, and Renovate bumps both. pass, gnupg,
# gettext (envsubst), rsync and openssl come from the system or Homebrew.

[settings]
# Install only what mise.lock describes, with its checksums.
locked = true

[tools]
"aqua:google/go-containerregistry" = "0.22.1"
"github:cachix/secretspec" = "0.21.1"
"github:home-operations/flate" = "v0.8.0"
# `kubectl config-import` for `just kube kubeconfig`; the release is one
# script for every platform.
"github:rafi/kubectl-config-import" = { version = "v0.6.7", asset_pattern = "kubectl-config_import", bin = "kubectl-config_import" }
flux2 = "2.10.1"
helm = "4.3.2"
jactionlint = "v2.6.0"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.2"
restic = "0.20.0"
shellcheck = "0.11.0"
yq = "4.54.3"
zizmor = "1.33.1"
