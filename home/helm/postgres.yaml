---
# Install:
#
#   helm install postgres oci://registry-1.docker.io/bitnamicharts/postgresql -n db -f helm/postgres.yaml
#
# https://github.com/bitnami/charts/blob/main/bitnami/postgresql/values.yaml

fullnameOverride: postgres

image:
  repository: bitnami/postgresql
  tag: 16.2.0-debian-12-r15

auth:
  username: rafi
  existingSecret: postgres-env
  secretKeys:
    adminPasswordKey: PG_POSTGRES_PASSWORD
    userPasswordKey: PG_USER_PASSWORD
    replicationPasswordKey: PG_REPLICATION_PASSWORD

readReplicas:
  replicaCount: 0

primary:
  extraEnvVarsSecret: postgres-env
  initdb:
    scripts:
      # Create databases and users from PG_DATABASE_[1-] variables.
      rafi_create.sh: |-
        #!/bin/bash
        set -ex
        i=0
        export PGPASSWORD="$PG_POSTGRES_PASSWORD"
        while true; do
          i=$((i+1))
          VAR_NAME="PG_DATABASE_$i"
          if [ -z "${!VAR_NAME+xxx}" ]; then
            break
          fi
          IFS=' ' read -r -a DB <<< "${!VAR_NAME}"
          DB_NAME="${DB[0]}"
          DB_USER="${DB[1]}"
          DB_PASSWORD="${DB[2]}"
          echo "Creating database $DB_NAME with user $DB_USER"

          psql -v ON_ERROR_STOP=1 --username postgres --dbname postgres 2>&1 <<EOSQL

            SHOW client_min_messages;

            DO
            \$do\$
            BEGIN
              IF EXISTS (
                  SELECT FROM pg_catalog.pg_roles
                  WHERE rolname = '$DB_USER') THEN

                  RAISE NOTICE 'Role "$DB_USER" already exists. Skipping.';
              ELSE
                  CREATE USER "$DB_USER" WITH PASSWORD '$DB_PASSWORD';
              END IF;
              IF EXISTS (
                  SELECT FROM pg_database WHERE datname = '$DB_NAME') THEN

                  RAISE NOTICE 'Database "$DB_NAME" already exists';
              ELSE
                  PERFORM dblink_exec('dbname=' || current_database()
                                    , 'CREATE DATABASE "$DB_NAME"');
              END IF;

              GRANT ALL PRIVILEGES ON DATABASE "$DB_NAME" TO "$DB_USER";
              \c "$DB_NAME" postgres;
              GRANT ALL ON SCHEMA public TO "$DB_USER";
              \c postgres postgres;

            END
            \$do\$;
        EOSQL
        done
