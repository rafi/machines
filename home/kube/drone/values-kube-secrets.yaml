---
# Drone Kubernetes Secrets Agent
# ---
# See: https://docs.drone.io/secret/external/kubernetes/
# Git: https://github.com/drone/drone-kubernetes-secrets
# Docker: https://hub.docker.com/r/drone/kubernetes-secrets

fullnameOverride: drone-kube-secrets

image:
  tag: latest
  pullPolicy: Always

resources:
  limits:
    cpu: 10m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 48Mi

extraSecretNamesForEnvFrom:
  - drone-secrets

rbac:
  secretNamespace: drone

# Ref: https://kube-runner.docs.drone.io/installation/reference/drone-secret-plugin-token/
env:
  # The Kubernetes namespace to retrieve secrets from.
  KUBERNETES_NAMESPACE: drone
  DEBUG: "false"
