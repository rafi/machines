apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: apps

resources:
  - deployment.yaml
  - ingress.yaml
  - service.yaml

images:
  - name: ghcr.io/miniflux/miniflux
    newTag: 2.1.2

labels:
  - includeSelectors: true
    pairs:
      app: miniflux
      instance: main

secretGenerator:
  - name: miniflux-env
    envs:
      - .env
