# See https://github.com/rapiz1/rathole#configuration
# FIXME: https://github.com/rapiz1/rathole/issues/218
# Rendered by `just server apply` with the values in ../secretspec.toml.
[server]
bind_addr = "0.0.0.0:${RATHOLE_SERVER_BIND_PORT}"
default_token = "${RATHOLE_DEFAULT_TOKEN}"

[server.transport]
type = "tls"
[server.transport.tls]
pkcs12 = "${RATHOLE_SERVER_PKCS12}"
pkcs12_password = "${RATHOLE_SERVER_PKCS12_PASSWORD}"

# The service name must be identical to the client side.
# ssh and ingress-tls are only reached on the server itself (nginx's stream
# block uses the same literal ports); ufw keeps ssh closed, ingress-tls is
# loopback only.
[server.services.ssh]
bind_addr = "0.0.0.0:32022"

# Every TLS connection, passed through untouched by nginx's stream block
# (with a PROXY header): Traefik's websecure port terminates it.
[server.services.ingress-tls]
bind_addr = "127.0.0.1:32443"

[server.services.slskd]
bind_addr = "0.0.0.0:${RATHOLE_SERVER_SERVICES_SLSKD_PORT}"
