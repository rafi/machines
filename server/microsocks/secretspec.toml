#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "machines"
revision = "1.0"

[profiles.default]
MICROSOCKS_PORT = { description = "Listen port; slskd on the cluster connects to it", required = true }
MICROSOCKS_USER = { description = "Proxy user", required = true }
MICROSOCKS_PASSWORD = { description = "Proxy password", required = true }
APP_VERSION = { description = "Release built from source without USE_PACKAGE_MANAGER (installer default applies if unset)", required = false }
