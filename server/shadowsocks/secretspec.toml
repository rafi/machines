#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "machines"
revision = "1.0"

[profiles.default]
SHADOWSOCKS_PORT = { description = "ssserver's public port (TCP); slskd's sslocal in the cluster connects to it", required = true }
SHADOWSOCKS_PASSWORD = { description = "2022-blake3-aes-256-gcm key: 32 random bytes, base64 (`openssl rand -base64 32`); equal in the cluster", required = true }
APP_VERSION = { description = "shadowsocks-rust release to install (installer default applies if unset)", required = false }
