# Network hardening for the server, installed to /etc/sysctl.d/ by
# bin/setup-server.sh. 11- sorts after Ubuntu's 10-network-security.conf.
# The server only proxies in user space (nginx, rathole, microsocks): it
# never routes packets. Enabling IP forwarding (e.g. for WireGuard) means
# changing ip_forward here.

# SYN-flood protection (Ubuntu's default, kept explicit).
net.ipv4.tcp_syncookies=1

# Ignore source-routed packets.
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
net.ipv6.conf.all.accept_source_route=0
net.ipv6.conf.default.accept_source_route=0

# Ignore ICMP redirects: the routes are static.
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0

# Not a router: don't forward, don't send redirects.
net.ipv4.ip_forward=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0

# Loose reverse-path filtering (Ubuntu's default): drops packets whose
# source isn't reachable through any interface. Strict (1) can drop replies
# that come back through another interface (the private VPC network, a
# reserved IP).
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2

# Ignore ICMP broadcasts (Smurf attacks) and bogus ICMP errors.
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1

# RFC 1337: drop RST packets for sockets in TIME_WAIT.
net.ipv4.tcp_rfc1337=1

# Randomize the address space layout (Ubuntu's default).
kernel.randomize_va_space=2

# Reboot 10 seconds after a kernel panic instead of hanging.
kernel.panic=10
