#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "machines"
revision = "1.0"

[profiles.default]
FLUX_TELEGRAM_BOT_TOKEN = { description = "Telegram bot token (shared with the cluster's alerts)", required = true }
