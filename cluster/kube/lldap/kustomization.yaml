---
# LLDAP
# https://github.com/lldap/lldap

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: auth

resources:
  - deployment.yaml
  - ingress.yaml
  - job-bootstrap.yaml
  - service.yaml
  - pvc.yaml

images:
  - name: lldap/lldap
    newTag: v0.5.0
  - name: lldap/bootstrap
    newName: lldap/lldap
    newTag: "2024-04-01"

labels:
  - includeSelectors: true
    pairs:
      app: lldap
      instance: nester

secretGenerator:
  - name: lldap-env
    envs:
      - .env
  - name: lldap-users
    files:
      - users/bind_user.json
      - users/amit.json
  - name: lldap-groups
    files:
      - users/groups.json
