---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.example.com
      secretName: authelia-tls
  rules:
    - host: auth.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia
                port:
                  number: 80
