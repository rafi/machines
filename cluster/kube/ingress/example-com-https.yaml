---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-com-https
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - req.example.com
    - rasa.example.com
    secretName: example-com-req-tls
  rules:
  - host: rasa.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rathole-server
            port:
              name: ingress
  - host: req.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rathole-server
            port:
              name: ingress
