---
# MINIFLUX
# https://github.com/miniflux/v2

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true

namespace: ingress

resources:
- example-com-https.yaml
- example-com-sso.yaml

labels:
  - includeSelectors: true
    pairs:
      app: miniflux
      instance: rafi
